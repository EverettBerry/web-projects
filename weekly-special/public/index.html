<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekly Special">
<meta name="theme-color" content="#f6f1e7">
<title>The Weekly Special</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f6f1e7;
  --card: #fffdf8;
  --ink: #1f1b16;
  --muted: #6b6257;
  --rule: #d9cfbf;
  --accent: #a3241c;
  --accent-ink: #fff;
  --good: #2f6b3a;
  --good-bg: #e4efe0;
  --chip: #efe7d8;
  --display: "Playfair Display", Georgia, serif;
  --serif: "Source Serif 4", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1a1815;
    --card: #24211c;
    --ink: #efe8dc;
    --muted: #a89f92;
    --rule: #3d3830;
    --accent: #e5675e;
    --accent-ink: #1a1815;
    --good: #8cc79a;
    --good-bg: #22311f;
    --chip: #2e2a23;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.5; }
[hidden] { display: none !important; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-block: max(12px, env(safe-area-inset-top)) max(40px, env(safe-area-inset-bottom));
  padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
}
header { text-align: center; border-bottom: 4px double var(--ink); padding-bottom: 8px; margin-bottom: 16px; }
.dateline { font-family: var(--sans); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2rem, 9vw, 3.2rem); line-height: 1; margin: 6px 0 4px; }
.tagline { font-style: italic; color: var(--muted); margin: 0; font-size: 15px; }
h2 { font-family: var(--display); font-size: 1.35rem; line-height: 1.2; margin: 0 0 8px; }
h3 { font-family: var(--display); font-size: 1.1rem; line-height: 1.25; margin: 0; }
section { margin-bottom: 18px; }
.card { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.sans { font-family: var(--sans); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.setup { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 10px; align-items: end; }
@media (max-width: 420px) { .setup { grid-template-columns: 1fr 1fr; } .setup .people { grid-column: 1 / -1; } }
label.field, .field { display: block; font-family: var(--sans); font-size: 12px; font-weight: 600; color: var(--muted); }
.field > span { display: block; margin-bottom: 4px; }
input, select { font-family: var(--sans); font-size: 16px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 10px; width: 100%; min-width: 0; }
input:focus, select:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); width: max-content; }
.stepper button { appearance: none; border: 0; background: none; color: var(--ink); font-size: 20px; width: 40px; height: 40px; cursor: pointer; }
.stepper output { min-width: 28px; text-align: center; font-family: var(--sans); font-weight: 700; }
details.more { margin-top: 10px; border-top: 1px dotted var(--rule); padding-top: 8px; }
details.more > summary { cursor: pointer; font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--accent); }
.more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.more-grid .full { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--rule); background: var(--chip); color: var(--ink); font-family: var(--sans); font-size: 13px; padding: 6px 10px; border-radius: 999px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-family: var(--sans); font-size: 14px; font-weight: 600; padding: 8px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.plain { background: transparent; color: var(--ink); border-color: var(--rule); }
.btn.sm { font-size: 13px; padding: 5px 10px; }
.btn[disabled] { opacity: .5; cursor: default; }

.status { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-family: var(--sans); font-size: 14px; }
.status strong { font-size: 15px; }
.status a { color: var(--accent); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--rule); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

.dinners { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dinner { padding: 12px 14px; }
.dinner .meta { font-family: var(--sans); font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
.dinner .uses { font-size: 14px; margin: 0 0 8px; }
.dinner .body { border-top: 1px dotted var(--rule); margin-top: 10px; padding-top: 8px; font-size: 15px; }
.dinner .body ul, .dinner .body ol { padding-left: 20px; margin: 4px 0 10px; }
.sale-tag { display: inline-block; font-family: var(--sans); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 0 4px; line-height: 16px; vertical-align: 1px; }
.tip { color: var(--good); }
.src { font-family: var(--sans); font-size: 13px; color: var(--accent); }

.totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; margin-bottom: 10px; }
.totals .num { font-family: var(--display); font-size: 1.5rem; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.totals .lbl { font-family: var(--sans); font-size: 12px; color: var(--muted); }
.totals .save .num { color: var(--good); }
.meter { height: 8px; background: var(--chip); border-radius: 999px; overflow: hidden; margin: 4px 0; }
.meter > div { height: 100%; background: var(--good); }
.meter.over > div { background: var(--accent); }
.cat { font-family: var(--sans); font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 2px; }
.shop { list-style: none; margin: 0; padding: 0; }
.shop li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dotted var(--rule); }
.shop li:last-child { border-bottom: 0; }
.shop input[type=checkbox] { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--good); }
.shop .what { font-size: 15px; }
.shop .sub { font-family: var(--sans); font-size: 12px; color: var(--muted); }
.shop .sub button { appearance: none; border: 0; background: none; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }
.shop .cost { font-family: var(--sans); font-size: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.shop li.done .what { text-decoration: line-through; color: var(--muted); }
.strike { text-decoration: line-through; }
.empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dateline" id="dateline"></div>
    <h1>The Weekly Special</h1>
    <p class="tagline">This week's dinners, built from what's on sale.</p>
  </header>

  <section class="card">
    <div class="setup">
      <label class="field"><span>ZIP code</span><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="5" placeholder="07030"></label>
      <label class="field"><span>Store</span><select id="store"></select></label>
      <div class="field people"><span>People</span>
        <div class="stepper"><button data-step="people" data-d="-1" aria-label="Fewer people">−</button><output id="peopleOut"></output><button data-step="people" data-d="1" aria-label="More people">+</button></div>
      </div>
    </div>
    <details class="more" id="more">
      <summary>More options</summary>
      <div class="more-grid">
        <div class="field"><span>Dinners per week</span>
          <div class="stepper"><button data-step="dinners" data-d="-1" aria-label="Fewer dinners">−</button><output id="dinnersOut"></output><button data-step="dinners" data-d="1" aria-label="More dinners">+</button></div>
        </div>
        <label class="field"><span>Budget ($)</span><input id="budget" type="number" inputmode="decimal" min="0" step="5" placeholder="No limit"></label>
        <label class="field"><span>Cooking time per night</span>
          <select id="maxTime">
            <option value="20">20 min or less</option>
            <option value="30">30 min or less</option>
            <option value="45">45 min or less</option>
            <option value="60">1 hour or less</option>
            <option value="999">No limit</option>
          </select>
        </label>
        <label class="field"><span>Access code</span><input id="code" autocomplete="off" autocapitalize="off" placeholder="Ask whoever set this up"></label>
        <div class="field full"><span>Dietary needs</span><div class="chips" id="diets"></div></div>
        <div class="field full"><span>For items not on sale, buy</span>
          <div class="chips"><button class="chip" data-pref="store" id="prefStore">Store brand</button><button class="chip" data-pref="name">Name brand</button></div>
        </div>
      </div>
    </details>
  </section>

  <section class="card status" id="status"></section>
  <input type="file" id="adPhotos" accept="image/*" multiple hidden>

  <section id="dinnersSection">
    <div class="spread"><h2>This week's dinners</h2><button class="btn sm plain" id="replanBtn">Start over</button></div>
    <ul class="dinners" id="dinners"></ul>
  </section>

  <section id="listSection">
    <div class="card">
      <div class="spread" style="margin-bottom:8px"><h2 style="margin:0">Shopping list</h2><button class="btn sm" id="shareBtn">Share</button></div>
      <div id="list"></div>
      <div class="small sans" id="shareFlash"></div>
    </div>
  </section>
</div>

<script type="module">
import { CATS, ITEMS } from './catalog.js';

const CATALOG = {};
for (const [key, n, u, st, b, c, f, a] of ITEMS) {
  CATALOG[key] = { key, n, u, s: st, b, c, f: f ? f.split(' ') : [], a: (a || '').split('|').filter(Boolean) };
}

// Pantry staples assumed on hand. Only the ones that matter for diets are listed.
const PANTRY = {
  'soy sauce': { f: ['gluten'], swap: 'tamari (gluten-free soy sauce)' },
  'flour': { f: ['gluten'], swap: 'cornstarch' },
  'honey': { f: ['honey'], swap: 'maple syrup' },
  'mayo': { f: ['egg'], swap: 'egg-free mayo' },
};

const DIETS = {
  vegetarian: { label: 'Vegetarian', no: ['meat', 'pork', 'fish', 'shellfish'] },
  vegan: { label: 'Vegan', no: ['meat', 'pork', 'fish', 'shellfish', 'dairy', 'egg', 'honey'] },
  pescatarian: { label: 'Pescatarian', no: ['meat', 'pork'] },
  glutenfree: { label: 'Gluten-free', no: ['gluten'] },
  dairyfree: { label: 'Dairy-free', no: ['dairy'] },
  nutfree: { label: 'Nut-free', no: ['nuts'] },
  eggfree: { label: 'Egg-free', no: ['egg'] },
  nopork: { label: 'No pork', no: ['pork'] },
  noshellfish: { label: 'No shellfish', no: ['shellfish'] },
  nosoy: { label: 'Soy-free', no: ['soy'] },
};

/* ---------- Recipes ----------
   Quantities are for 4 servings, in the catalog item's unit.
   opt = ingredients that can be left off if they conflict with a diet. */
const RECIPES = [];
function R(id, name, time, active, ings, opt, pantry, steps) {
  RECIPES.push({ id, name, time, active: active || time, ings, opt, pantry, steps });
}
R('sheet_chicken', 'Sheet-Pan Lemon Chicken & Potatoes', 45, 15,
  { chicken_thigh: 2, potatoes: 1.5, green_beans: 1, lemon: 1, garlic: .25 }, [],
  ['olive oil', 'salt & pepper', 'dried oregano'],
  ['Heat oven to 425°F. Cut potatoes into 1-inch chunks.',

   'Serve with the rest of the lemon cut into wedges.']);
R('chicken_stirfry', 'Chicken & Broccoli Stir-Fry', 25, 0,

  ['soy sauce', 'honey', 'cornstarch', 'vegetable oil'],

   'Stir-fry the chicken in a hot oiled skillet 5–6 minutes and set aside. Stir-fry broccoli and pepper 4 minutes.',
   'Return the chicken, add garlic, 3 Tbsp soy sauce and 1 Tbsp honey, and toss 1 minute. Top with green onions and serve over rice.']);
R('fajitas', 'Chicken Fajitas', 30, 0,
  { chicken_breast: 1.5, bell_pepper: 3, onion: 1, flour_tortilla: 1, sour_cream: 1, lime: 2 }, ['sour_cream'],
  ['chili powder', 'cumin', 'vegetable oil', 'salt'],
  ['Slice chicken, peppers and onion into strips.',
   'Toss chicken with 2 tsp chili powder, 1 tsp cumin, salt and the juice of 1 lime.',
   'Sear chicken in a hot oiled skillet 6–7 minutes and remove. Cook peppers and onion 5 minutes until charred at the edges.',
   'Return the chicken, squeeze over the second lime, and serve in warm tortillas with sour cream.']);
R('tortilla_soup', 'Chicken Tortilla Soup', 40, 15,
  { chicken_breast: 1, broth: 2, canned_tomatoes: 1, black_beans: 1, corn: 2, onion: 1, corn_tortilla: .5, avocado: 1, cilantro: 1, lime: 1 }, ['avocado', 'cilantro'],

R('salmon', 'Lemon Garlic Salmon with Asparagus', 25, 0,

  ['chili powder', 'garlic powder', 'vegetable oil', 'salt'],

   'Stir a squeeze of lime into the sour cream for a quick crema.',
   'Warm the tortillas and fill with shrimp, slaw, avocado and crema.']);
R('shrimp_pasta', 'Garlic Butter Shrimp Pasta', 25, 0,

R('sweet_potato_tacos', 'Sweet Potato & Black Bean Tacos', 35, 15,
  { sweet_potato: 1.5, black_beans: 2, corn_tortilla: 1, avocado: 1, lime: 1, cilantro: 1, onion: .5, sour_cream: 1 }, ['sour_cream', 'cilantro'],
  ['olive oil', 'chili powder', 'cumin', 'salt'],

const RECIPE_BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));

const STORES = {
  'Kroger': 'Kroger', 'Walmart': 'Great Value', 'Publix': 'Publix', 'H-E-B': 'H-E-B', 'Aldi': 'Aldi',
  'Safeway / Albertsons': 'Signature Select', 'Target': 'Good & Gather', 'Meijer': 'Meijer',
  'Food Lion': 'Food Lion', 'Wegmans': 'Wegmans', 'Hy-Vee': 'Hy-Vee', 'Harris Teeter': 'Harris Teeter',
  'Giant': 'Giant', 'ShopRite': 'Bowl & Basket', 'Stop & Shop': 'Stop & Shop', 'Costco': 'Kirkland', "Trader Joe's": "Trader Joe's",
  'Acme Markets': 'Signature Select', 'ALDI': 'ALDI', 'Lidl': 'Lidl', "Wegman's": 'Wegmans',
  'Other': 'Store brand',
};


/* ---------- State ---------- */
const STORE_KEY = 'weeklySpecial.v2';
const DEFAULT_STATE = {
  settings: { zip: '', store: 'ShopRite', code: '', people: 4, dinners: 5, budget: '', maxTime: 45, diets: [], pref: 'store' },
  flyers: null,    // {zip, list, at}: weekly ads near the ZIP
  ad: [],          // sale items in use: [{key, sale, reg}]
  adSource: null,  // {id, label, link}: where `ad` came from
  plan: [],        // recipe ids
  brand: {},       // key -> 'store' | 'name'
  checked: {},     // key -> true
  open: {},        // recipe id -> expanded
};
let state = load();
let busy = null;   // what's loading right now, shown in the status card
let problem = '';  // last error, shown in the status card

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      return { ...DEFAULT_STATE, ...s, settings: { ...DEFAULT_STATE.settings, ...s.settings } };
    }
  } catch (e) { /* storage unavailable */ }
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = n => '$' + (Math.round(n * 100) / 100).toFixed(2);
const scale = () => state.settings.people / 4;
const adMap = () => Object.fromEntries(state.ad.map(a => [a.key, a]));
const storeBrand = () => STORES[state.settings.store] || 'Store brand';
const hasBrands = it => it.b > it.s;

const EIGHTHS = ['', '⅛', '¼', '⅜', '½', '⅝', '¾', '⅞'];
function fq(n) {
  let r = Math.round(n * 8) / 8;
  if (r === 0) r = .125;
  const w = Math.floor(r);
  return (w ? w : '') + EIGHTHS[Math.round((r - w) * 8)];
}
function unitWord(u, q) {
  if (u === 'each') return '';
  if (q <= 1 || ['lb', 'dozen', 'half gallon'].includes(u)) return u;
  return u === 'box' ? 'boxes' : u === 'bunch' ? 'bunches' : u + 's';
}
function amount(key, q) {
  const it = CATALOG[key];
  return it.u === 'each' ? `${fq(q)} × ${it.n}` : `${fq(q)} ${unitWord(it.u, q)} ${it.n}`;
}
function perUnit(u) { return u === 'each' ? ' each' : '/' + (u === 'half gallon' ? '½ gal' : u); }
function buyQty(key, q) {
  return CATALOG[key].u === 'lb' ? Math.ceil(q * 4 - 1e-9) / 4 : Math.max(1, Math.ceil(q - 1e-9));
}
function brandFor(key) { return state.brand[key] || state.settings.pref; }
function unitPrice(key, ad) {
  if (ad[key]) return ad[key].sale;
  const it = CATALOG[key];
  return brandFor(key) === 'name' ? it.b : it.s;
}
function forbidden() { return new Set(state.settings.diets.flatMap(d => DIETS[d].no)); }

/* Applies the household's diet and size to a recipe.
   Returns null if a required ingredient conflicts with the diet. */
function evalRecipe(r) {
  const bad = forbidden(), ad = adMap(), k = scale();
  const ings = [], skipped = [];
  for (const [key, q] of Object.entries(r.ings)) {
    const it = CATALOG[key];
    if (it.f.some(f => bad.has(f))) {
      if (r.opt.includes(key)) { skipped.push(key); continue; }
      return null;
    }
    ings.push({ key, qty: q * k, sale: !!ad[key] });
  }
  const swaps = r.pantry
    .filter(p => PANTRY[p] && PANTRY[p].f.some(f => bad.has(f)))
    .map(p => `Use ${PANTRY[p].swap} instead of ${p}.`);
  let cost = 0, saleSave = 0;
  const saleItems = [];
  for (const i of ings) {
    cost += i.qty * unitPrice(i.key, ad);
    if (i.sale) {
      saleItems.push(i.key);
      saleSave += i.qty * Math.max(0, ad[i.key].reg - ad[i.key].sale);
    }
  }
  const perServing = cost / state.settings.people;
  const score = saleSave + 1.5 * saleItems.length - 0.5 * perServing;
  return { r, ings, skipped, swaps, cost, perServing, saleSave, saleItems, score };
}

function candidates() {
  return RECIPES.map(evalRecipe)
    .filter(e => e && e.r.active <= state.settings.maxTime)
    .sort((a, b) => b.score - a.score);
}

/* Combines the planned recipes into one shopping list with prices. */
function buildList(planIds) {
  const ad = adMap(), k = scale(), need = {}, pantry = new Set(), warnings = [];
  for (const id of planIds) {
    const r = RECIPE_BY_ID[id];
    if (!r) continue;
    const e = evalRecipe(r);
    if (!e) warnings.push(r.name);
    const ings = e ? e.ings : Object.entries(r.ings).map(([key, q]) => ({ key, qty: q * k }));
    for (const i of ings) need[i.key] = (need[i.key] || 0) + i.qty;
    r.pantry.flatMap(p => p === 'salt & pepper' ? ['salt', 'pepper'] : [p]).forEach(p => pantry.add(p));
  }
  let total = 0, regular = 0, saleSave = 0, brandSave = 0;
  const items = Object.entries(need).map(([key, q]) => {
    const it = CATALOG[key], buy = buyQty(key, q), sale = ad[key];
    const brand = sale ? 'sale' : (hasBrands(it) ? brandFor(key) : 'store');
    const price = sale ? sale.sale : (brand === 'name' ? it.b : it.s);
    const reg = sale ? Math.max(sale.reg, sale.sale) : it.b;
    const cost = buy * price;
    total += cost;
    regular += buy * reg;
    if (sale) saleSave += buy * (reg - sale.sale);
    else if (brand === 'store') brandSave += buy * (it.b - it.s);
    return { key, it, q, buy, sale, brand, price, cost, reg };
  });
  items.sort((a, b) => CATS.indexOf(a.it.c) - CATS.indexOf(b.it.c) || a.it.n.localeCompare(b.it.n));
  return { items, pantry: [...pantry].sort(), total, regular, saleSave, brandSave, warnings };
}

function autoPlan() {
  const budget = parseFloat(state.settings.budget) || Infinity;
  let pool = candidates();
  if (state.ad.length) {
    const sale = pool.filter(e => e.saleItems.length);
    if (sale.length >= state.settings.dinners) pool = sale;
  }
  const plan = [], mains = new Set();
  const main = e => Object.keys(e.r.ings)[0];
  while (plan.length < state.settings.dinners && pool.length) {
    pool.sort((a, b) => (b.score - (mains.has(main(b)) ? 6 : 0)) - (a.score - (mains.has(main(a)) ? 6 : 0)));
    const pick = pool.find(e => buildList([...plan, e.r.id]).total <= budget);
    if (!pick) break;
    plan.push(pick.r.id);
    mains.add(main(pick));
    pool = pool.filter(e => e !== pick);
  }
  return plan;
}


function addAdItem(key, sale, reg) {
  const it = CATALOG[key];
  const r = reg && reg > 0 ? reg : Math.max(it.b, sale);
  state.ad = state.ad.filter(a => a.key !== key);
  state.ad.push({ key, sale: Math.round(sale * 100) / 100, reg: Math.round(r * 100) / 100 });
}


/* ---------- Loading the weekly ad ---------- */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (state.settings.code) headers['x-site-code'] = state.settings.code;
  const res = await fetch(path, { ...opts, headers });
  let body = null;
  try { body = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error((body && body.error) || 'Something went wrong. Try again.');
  return body;
}

function storeFlyers() {
  const f = state.flyers;
  if (!f || f.zip !== state.settings.zip) return [];
  const now = Date.now();
  return f.list.filter(x => x.merchant === state.settings.store && (!x.validTo || new Date(x.validTo).getTime() > now));
}

// The ad running today: started already, "weekly" ads first.
function currentFlyer() {
  const now = Date.now();
  const list = storeFlyers().slice().sort((a, b) => /week/i.test(b.name) - /week/i.test(a.name));
  return list.find(f => !f.validFrom || new Date(f.validFrom).getTime() <= now) || list[0] || null;
}

async function loadStores() {
  const zip = state.settings.zip;
  if (!/^\d{5}$/.test(zip)) return;
  busy = 'Finding stores near you...';
  renderStatus();
  try {
    const { flyers } = await api(`/api/stores?zip=${zip}`);
    state.flyers = { zip, list: flyers, at: Date.now() };
    save();
    problem = '';
  } catch (e) {
    problem = e.message;
  }
  busy = null;
  renderStoreSelect();
  loadAd();
}

// Uses the current ad for the chosen store, if it isn't the one already in use.
async function loadAd() {
  const f = currentFlyer();
  if (!f || (state.adSource && state.adSource.id === f.id)) return renderStatus();
  if (!state.settings.code) {
    problem = 'Enter the access code under More options to load the ad.';
    return renderStatus();
  }
  busy = `Loading the ${f.merchant} ad. This can take up to a minute.`;
  problem = '';
  renderStatus();
  try {
    const { items } = await api(`/api/ad?flyer=${f.id}&store=${encodeURIComponent(f.merchant)}`);
    useAd(items, { id: f.id, label: `${f.merchant} ${/^week/i.test(f.name) ? f.name.toLowerCase() : 'weekly ad'}`, link: f.source || '' });
  } catch (e) {
    problem = e.message;
  }
  busy = null;
  render();
}

async function readScreenshots(files) {
  if (!state.settings.code) {
    problem = 'Enter the access code under More options first.';
    return renderStatus();
  }
  const found = [];
  problem = '';
  try {
    for (let i = 0; i < files.length; i += 8) {
      busy = files.length > 8 ? `Reading the ad (part ${i / 8 + 1} of ${Math.ceil(files.length / 8)})...` : 'Reading your screenshots. This takes about a minute.';
      renderStatus();
      const form = new FormData();
      for (const f of files.slice(i, i + 8)) form.append('images', await shrink(f), 'page.jpg');
      form.append('store', state.settings.store);
      found.push(...(await api('/api/read-ad', { method: 'POST', body: form })).items);
    }
    useAd(found, { id: 'screens', label: 'your screenshots', link: '' });
  } catch (e) {
    problem = e.message;
  }
  busy = null;
  render();
}

// Puts every matched sale item into use and plans the week around them.
function useAd(items, source) {
  state.ad = [];
  items.filter(i => i.key && CATALOG[i.key] && i.sale > 0)
    .sort((a, b) => b.sale - a.sale)
    .forEach(i => addAdItem(i.key, i.sale, i.regular));
  state.adSource = source;
  state.checked = {};
  state.open = {};
  state.plan = autoPlan();
  save();
}

// Shrinks a photo so uploads stay small; the server and Claude don't need full resolution.
async function shrink(file) {
  try {
    const img = await createImageBitmap(file);
    const k = Math.min(1, 2400 / Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(img.width * k);
    canvas.height = Math.round(img.height * k);
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    return await new Promise(r => canvas.toBlob(b => r(b || file), 'image/jpeg', 0.85));
  } catch (e) {
    return file;
  }
}


/* ---------- Plan changes ---------- */
function replan() {
  state.plan = autoPlan();
  state.checked = {};
  save();
  render();
}

// Replaces one dinner with the best recipe not already planned.
function swap(id) {
  const budget = parseFloat(state.settings.budget) || Infinity;
  const others = state.plan.filter(x => x !== id);
  const tried = state.swapped && state.swapped[id] ? state.swapped[id] : [];
  const next = candidates().find(e => !state.plan.includes(e.r.id) && !tried.includes(e.r.id) && buildList([...others, e.r.id]).total <= budget);
  if (!next) return;
  state.plan = state.plan.map(x => x === id ? next.r.id : x);
  state.swapped = { [next.r.id]: [...tried, id] };
  delete state.open[id];
  save();
  render();
}

/* ---------- Rendering ---------- */
function renderStoreSelect() {
  const s = state.settings;
  const f = state.flyers && state.flyers.zip === s.zip ? state.flyers.list : [];
  const auto = [...new Set(f.map(x => x.merchant))].sort((a, b) => a.localeCompare(b));
  const manual = Object.keys(STORES).filter(n => !auto.includes(n));
  if (!auto.includes(s.store) && !manual.includes(s.store)) manual.unshift(s.store);
  const opts = list => list.map(n => `<option ${n === s.store ? 'selected' : ''}>${esc(n)}</option>`).join('');
  $('#store').innerHTML = auto.length
    ? `<optgroup label="Ad loads automatically">${opts(auto)}</optgroup><optgroup label="Ad from screenshots">${opts(manual)}</optgroup>`
    : opts(manual);
}

function renderSetup() {
  const s = state.settings;
  $('#zip').value = s.zip;
  $('#code').value = s.code;
  $('#budget').value = s.budget;
  $('#maxTime').value = String(s.maxTime);
  $('#peopleOut').textContent = s.people;
  $('#dinnersOut').textContent = s.dinners;
  $('#diets').innerHTML = Object.entries(DIETS).map(([k, d]) =>
    `<button class="chip" data-diet="${k}" aria-pressed="${s.diets.includes(k)}">${d.label}</button>`).join('');
  document.querySelectorAll('[data-pref]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pref === s.pref));
  $('#prefStore').textContent = `Store brand (${storeBrand()})`;
  renderStoreSelect();
  if (!s.code) $('#more').open = true;
}

function renderStatus() {
  const el = $('#status');
  const s = state.settings;
  const d = new Date();
  d.setDate(d.getDate() - d.getDay());
  $('#dateline').textContent = `Week of ${d.toLocaleDateString(undefined, { month: 'long', day: 'numeric' })}`;
  if (busy) {
    el.innerHTML = `<div><span class="spinner"></span>${esc(busy)}</div>`;
    return;
  }
  if (!/^\d{5}$/.test(s.zip)) {
    el.innerHTML = `<div>Enter your ZIP code to load this week's sale ad.</div>`;
    return;
  }
  const auto = !!currentFlyer();
  const n = state.ad.length;
  let msg;
  if (state.adSource && n) {
    const from = state.adSource.link ? ` <a href="${esc(state.adSource.link)}" target="_blank" rel="noopener">(source)</a>` : '';
    msg = `<div><strong>Using ${n} sale item${n === 1 ? '' : 's'}</strong> from ${esc(state.adSource.label)}${from}.</div>`;
  } else if (state.adSource) {
    msg = `<div>No recipe ingredients were on sale in ${esc(state.adSource.label)}. Dinners use regular prices.</div>`;
  } else if (auto) {
    msg = `<div>This week's ${esc(s.store)} ad hasn't loaded yet.</div>`;
  } else {
    msg = `<div>${esc(s.store)}'s ad doesn't load automatically. Screenshot it in the store's app or website, then add the screenshots here.</div>`;
  }
  const buttons = auto
    ? `<button class="btn sm plain" id="reloadBtn">Reload ad</button>`
    : `<button class="btn sm" id="photoBtn">Add ad screenshots</button>`;
  el.innerHTML = `${msg}<div class="row">${buttons}</div>${problem ? `<div style="flex-basis:100%;color:var(--accent)">${esc(problem)}</div>` : ''}`;
}

function dinnerCard(id) {
  const r = RECIPE_BY_ID[id];
  const e = evalRecipe(r);
  const open = !!state.open[id];
  const ad = adMap();
  const time = r.time > r.active ? `${r.active} min hands-on, ${r.time >= 120 ? Math.round(r.time / 60 * 2) / 2 + ' hr' : r.time + ' min'} total` : `${r.time} min`;
  if (!e) return `<li class="card dinner"><h3>${esc(r.name)}</h3><p class="small" style="color:var(--accent)">Doesn't fit your dietary needs anymore.</p><button class="btn sm plain" data-swap="${id}">Swap</button></li>`;
  const uses = e.saleItems.length
    ? `<p class="uses"><span class="sale-tag">On sale</span> ${e.saleItems.map(k => esc(CATALOG[k].n.replace(/\s*\(.*\)/, ''))).join(', ')}</p>`
    : '';
  let body = '';
  if (open) {
    const notes = [...e.skipped.map(k => `Leave off the ${CATALOG[k].n.replace(/\s*\(.*\)/, '').toLowerCase()} to fit your diet.`), ...e.swaps];
    body = `<div class="body">
      <ul>${e.ings.map(i => `<li>${esc(amount(i.key, i.qty))}${i.sale ? ` <span class="sale-tag">Sale ${money(ad[i.key].sale)}${perUnit(CATALOG[i.key].u)}</span>` : ''}</li>`).join('')}</ul>
      <div class="small muted">From the pantry: ${esc(r.pantry.join(', '))}</div>
      ${notes.length ? `<ul class="small">${notes.map(n => `<li class="tip">${esc(n)}</li>`).join('')}</ul>` : ''}
      <ol>${r.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>
      ${SOURCES[id] ? `<a class="src" href="${esc(SOURCES[id].url)}" target="_blank" rel="noopener">Full recipe at ${esc(SOURCES[id].site)} ↗</a>` : ''}
    </div>`;
  }
  return `<li class="card dinner">
    <h3>${esc(r.name)}</h3>
    <div class="meta">${time} · about ${money(e.perServing)} a serving</div>
    ${uses}
    <div class="row">
      <button class="btn sm plain" data-open="${id}">${open ? 'Hide recipe' : 'Recipe'}</button>
      <button class="btn sm plain" data-swap="${id}">Swap</button>
    </div>
    ${body}
  </li>`;
}

function renderDinners() {
  $('#dinners').innerHTML = state.plan.length
    ? state.plan.filter(id => RECIPE_BY_ID[id]).map(dinnerCard).join('')
    : `<li class="empty">No dinners fit your settings. Try allowing more cooking time or a bigger budget under More options.</li>`;
}

function renderList() {
  const s = state.settings;
  const L = buildList(state.plan);
  if (!state.plan.length) {
    $('#list').innerHTML = '<p class="empty">Your list appears here once dinners are planned.</p>';
    return;
  }
  const budget = parseFloat(s.budget);
  const saved = L.regular - L.total;
  const meter = budget > 0
    ? `<div class="meter ${L.total > budget ? 'over' : ''}"><div style="width:${Math.min(100, L.total / budget * 100)}%"></div></div>
       <div class="small sans muted">${money(L.total)} of your ${money(budget)} budget</div>`
    : '';
  let html = '', cat = '';
  for (const i of L.items) {
    if (i.it.c !== cat) {
      if (cat) html += '</ul>';
      cat = i.it.c;
      html += `<div class="cat">${esc(cat)}</div><ul class="shop">`;
    }
    const qty = i.it.u === 'each' ? `${fq(i.buy)} ×` : `${fq(i.buy)} ${unitWord(i.it.u, i.buy)}`;
    let sub;
    if (i.sale) sub = `<span class="sale-tag">Sale</span> ${money(i.price)}${perUnit(i.it.u)} <span class="strike">${money(i.reg)}</span>`;
    else if (hasBrands(i.it)) {
      const other = i.brand === 'store' ? 'name' : 'store';
      sub = `${i.brand === 'store' ? esc(storeBrand()) : 'Name brand'} ${money(i.price)} · <button data-brand="${i.key}:${other}">${other === 'store' ? 'switch to store brand' : 'switch to name brand'}</button>`;
    } else sub = `${money(i.price)}${perUnit(i.it.u)}`;
    html += `<li class="${state.checked[i.key] ? 'done' : ''}">
      <input type="checkbox" data-check="${i.key}" ${state.checked[i.key] ? 'checked' : ''} aria-label="Got ${esc(i.it.n)}">
      <div><div class="what">${esc(qty)} ${esc(i.it.n)}</div><div class="sub">${sub}</div></div>
      <div class="cost">${money(i.cost)}</div>
    </li>`;
  }
  if (cat) html += '</ul>';
  $('#list').innerHTML = `
    <div class="totals">
      <div><div class="num">${money(L.total)}</div><div class="lbl">Total</div></div>
      <div class="save"><div class="num">${money(saved)}</div><div class="lbl">You save</div></div>
      <div><div class="num">${money(L.total / (state.plan.length * s.people))}</div><div class="lbl">Per serving</div></div>
    </div>
    ${meter}
    ${html}
    <div class="cat">Check the pantry for</div>
    <p class="small" style="margin:0">${esc(L.pantry.join(', '))}</p>`;
}

function render() {
  renderStatus();
  renderDinners();
  renderList();
}

function listText() {
  const L = buildList(state.plan);
  const lines = ['The Weekly Special', '', 'Dinners:', ...state.plan.map(id => '• ' + RECIPE_BY_ID[id].name)];
  let cat = '';
  for (const i of L.items) {
    if (i.it.c !== cat) { cat = i.it.c; lines.push('', cat.toUpperCase()); }
    const qty = i.it.u === 'each' ? fq(i.buy) + ' ×' : fq(i.buy) + ' ' + unitWord(i.it.u, i.buy);
    lines.push(`☐ ${qty} ${i.it.n}${i.sale ? ' (SALE)' : ''}: ${money(i.cost)}`);
  }
  lines.push('', `Total about ${money(L.total)}, saving ${money(L.regular - L.total)}`);
  return lines.join('\n');
}

/* ---------- Events ---------- */
function setSetting(k, v, then) {
  state.settings[k] = v;
  save();
  if (then) then();
}

$('#zip').addEventListener('input', e => {
  setSetting('zip', e.target.value.trim());
  if (/^\d{5}$/.test(state.settings.zip)) loadStores(); else renderStatus();
});
$('#store').addEventListener('change', e => {
  setSetting('store', e.target.value);
  $('#prefStore').textContent = `Store brand (${storeBrand()})`;
  state.ad = []; state.adSource = null; state.plan = autoPlan(); save();
  render();
  loadAd();
});
$('#code').addEventListener('change', e => { setSetting('code', e.target.value.trim()); loadAd(); });
$('#budget').addEventListener('change', e => setSetting('budget', e.target.value, replan));
$('#maxTime').addEventListener('change', e => setSetting('maxTime', parseInt(e.target.value, 10), replan));
$('#adPhotos').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) readScreenshots(files);
});

document.addEventListener('click', e => {
  const t = e.target.closest('button, input');
  if (!t) return;
  const d = t.dataset;
  if (d.step) {
    const lim = { people: [1, 12], dinners: [1, 7] }[d.step];
    const v = Math.min(lim[1], Math.max(lim[0], state.settings[d.step] + parseInt(d.d, 10)));
    $(`#${d.step}Out`).textContent = v;
    return setSetting(d.step, v, replan);
  }
  if (d.diet) {
    const s = state.settings;
    s.diets = s.diets.includes(d.diet) ? s.diets.filter(x => x !== d.diet) : [...s.diets, d.diet];
    t.setAttribute('aria-pressed', s.diets.includes(d.diet));
    return replan();
  }
  if (d.pref) {
    state.settings.pref = d.pref;
    state.brand = {};
    document.querySelectorAll('[data-pref]').forEach(b => b.setAttribute('aria-pressed', b.dataset.pref === d.pref));
    save();
    return renderList();
  }
  if (d.open) { state.open[d.open] = !state.open[d.open]; save(); return renderDinners(); }
  if (d.swap) return swap(d.swap);
  if (d.brand) { const [k, b] = d.brand.split(':'); state.brand[k] = b; save(); return renderList(); }
  if (d.check) { state.checked[d.check] = t.checked; save(); t.closest('li').classList.toggle('done', t.checked); return; }
  if (t.id === 'replanBtn') return replan();
  if (t.id === 'photoBtn') return $('#adPhotos').click();
  if (t.id === 'reloadBtn') { state.adSource = null; return loadAd(); }
  if (t.id === 'shareBtn') {
    const text = listText();
    const flash = $('#shareFlash');
    const copy = () => navigator.clipboard
      ? navigator.clipboard.writeText(text).then(() => { flash.textContent = 'Copied the list.'; }, () => { flash.textContent = "Couldn't copy on this device."; })
      : null;
    if (navigator.share) return navigator.share({ title: 'Grocery list', text }).catch(err => { if (err.name !== 'AbortError') copy(); });
    copy();
  }
});

renderSetup();
if (!state.plan.length) state.plan = autoPlan();
render();
const stale = !state.flyers || state.flyers.zip !== state.settings.zip || Date.now() - state.flyers.at > 6 * 3600e3;
if (/^\d{5}$/.test(state.settings.zip)) { if (stale) loadStores(); else loadAd(); }
</script>
</body>
</html>
